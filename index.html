<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Animated Flowers</title>
  <meta name="description" content="A little garden that grows at dusk. Tap to plant a flower." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>" />
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0820; }
    canvas { display: block; width: 100vw; height: 100vh; cursor: crosshair; touch-action: none; }
    #hint {
      position: fixed; left: 50%; top: 28px; transform: translateX(-50%);
      font: 300 15px/1.4 "Georgia", serif; letter-spacing: .12em; color: rgba(255,240,250,.75);
      text-shadow: 0 0 12px rgba(255,180,220,.6); pointer-events: none; user-select: none;
      transition: opacity 2s ease; white-space: nowrap;
    }
    #hint.hidden { opacity: 0; }
  </style>
</head>
<body>
  <canvas id="garden"></canvas>
  <div id="hint">tap anywhere to plant a flower</div>
  <script src="flowers.js"></script>
</body>
</html>
