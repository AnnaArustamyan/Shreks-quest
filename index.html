<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Petal Quest</title>
  <meta name="description" content="A tiny pixel platformer: collect flowers for your love across 3 levels, then celebrate the wedding." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="game" width="400" height="225"></canvas>

  <button id="mute" aria-label="Toggle sound">♪</button>

  <div id="touch">
    <div class="pad">
      <button data-act="left" aria-label="Left">◀</button>
      <button data-act="right" aria-label="Right">▶</button>
    </div>
    <div class="pad">
      <button data-act="action" aria-label="Action">B</button>
      <button data-act="jump" aria-label="Jump">A</button>
    </div>
  </div>

  <script src="js/audio.js"></script>
  <script src="js/art.js"></script>
  <script src="js/levels.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
